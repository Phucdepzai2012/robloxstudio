<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Drive - GitHub Storage</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            padding: 30px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .upload-box {
            border: 2px dashed #3498db;
            border-radius: 8px;
            padding: 30px 20px;
            text-align: center;
            background: #ecf0f1;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
        }

        .upload-box:hover {
            background: #e1e8ed;
            border-color: #2980b9;
        }

        input[type="file"] {
            display: none;
        }

        .btn-upload {
            width: 100%;
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-upload:hover {
            background-color: #27ae60;
        }

        .btn-upload:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        #file-info {
            margin-top: 10px;
            font-size: 14px;
            color: #555;
            word-break: break-all;
        }

        #status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
            word-break: break-word;
        }

        .status-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status-loading {
            background-color: #cce5ff;
            color: #004085;
            border: 1px solid #b8daff;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Cloud Drive Storage</h2>
    
    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <p id="upload-label">📁 Bấm vào đây để chọn file</p>
        <input type="file" id="fileInput" onchange="handleFileSelect(event)">
    </div>

    <div id="file-info"></div>

    <button class="btn-upload" id="uploadBtn" onclick="uploadToGitHub()" disabled>Tải lên GitHub</button>

    <div id="status"></div>
</div>

<script>
    // ⚙️ CẤU HÌNH GITHUB - BẠN THAY ĐÚNG THÔNG TIN CỦA BẠN VÀO ĐÂY:
    const GITHUB_CONFIG = {
        token: "Điền_Personal_Access_Token_Của_Bạn", 
        owner: "Tên_User_GitHub_Của_Bạn", 
        repo: "Tên_Repo_Của_Bạn",            
        branch: "main"
    };

    let selectedFile = null;

    function handleFileSelect(event) {
        const files = event.target.files;
        if (files.length > 0) {
            selectedFile = files[0];
            document.getElementById('file-info').innerText = `Đã chọn: ${selectedFile.name} (${(selectedFile.size / 1024).toFixed(1)} KB)`;
            document.getElementById('uploadBtn').disabled = false;
        }
    }

    function showStatus(message, type) {
        const statusDiv = document.getElementById('status');
        statusDiv.style.display = 'block';
        statusDiv.className = `status-${type}`;
        statusDiv.innerHTML = message;
    }

    async function uploadToGitHub() {
        if (!selectedFile) return;

        // 1. Kiểm tra dung lượng file (GitHub REST API giới hạn 25MB)
        if (selectedFile.size > 25 * 1024 * 1024) {
            showStatus("❌ File quá lớn! GitHub REST API chỉ hỗ trợ tải file nhỏ hơn 25 MB.", "error");
            return;
        }

        const uploadBtn = document.getElementById('uploadBtn');
        uploadBtn.disabled = true;
        showStatus("⏳ Đang xử lý và tải file lên...", "loading");

        try {
            // 2. Mã hóa file sang Base64
            const base64Content = await convertFileToBase64(selectedFile);

            // 3. Chuẩn hóa tên file (mã hóa đường dẫn tránh lỗi dấu tiếng Việt / khoảng trắng)
            const safeFileName = encodeURIComponent(selectedFile.name);
            const apiUrl = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${safeFileName}`;

            // 4. Kiểm tra xem file đã tồn tại trên Repo chưa (để lấy mã SHA ghi đè)
            let existingSha = null;
            try {
                const checkResponse = await fetch(apiUrl, {
                    headers: {
                        'Authorization': `token ${GITHUB_CONFIG.token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                if (checkResponse.ok) {
                    const existingData = await checkResponse.json();
                    existingSha = existingData.sha; // Lấy SHA để ghi đè file cũ
                }
            } catch (e) {
                // Nếu file chưa tồn tại thì bỏ qua
            }

            // 5. Chuẩn bị Body gửi lên API
            const requestBody = {
                message: `Upload file: ${selectedFile.name}`,
                content: base64Content,
                branch: GITHUB_CONFIG.branch
            };

            if (existingSha) {
                requestBody.sha = existingSha;
            }

            // 6. Thực hiện gửi Request Upload (PUT)
            const response = await fetch(apiUrl, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${GITHUB_CONFIG.token}`,
                    'Content-Type': 'application/json',
                    'Accept': 'application/vnd.github.v3+json'
                },
                body: JSON.stringify(requestBody)
            });

            const responseData = await response.json();

            if (response.ok) {
                const downloadUrl = responseData.content.download_url;
                showStatus(`✅ Upload thành công!<br><a href="${downloadUrl}" target="_blank" style="color: #155724; font-weight: bold;">Xem/Tải file trực tiếp</a>`, "success");
            } else {
                // Xử lý báo lỗi chi tiết theo từng mã HTTP
                let errorMsg = responseData.message || "Không xác định";
                if (response.status === 401) {
                    errorMsg = "Token không hợp lệ hoặc đã hết hạn (Lỗi 401).";
                } else if (response.status === 403) {
                    errorMsg = "Token thiếu quyền 'Contents' (Read & Write) hoặc tài khoản bị giới hạn (Lỗi 403).";
                } else if (response.status === 404) {
                    errorMsg = "Sai tên User (`owner`) hoặc sai tên Repository (`repo`) (Lỗi 404).";
                }
                showStatus(`❌ Tải lên thất bại! [Mã ${response.status}]: ${errorMsg}`, "error");
            }
        } catch (error) {
            showStatus(`❌ Đã xảy ra lỗi kết nối: ${error.message}`, "error");
        } finally {
            uploadBtn.disabled = false;
        }
    }

    // Hàm hỗ trợ chuyển File sang Base64 chuẩn (đã cắt bỏ Prefix)
    function convertFileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => {
                // Cắt bỏ tiền tố "data:*;base64,"
                const base64String = reader.result.split(',')[1];
                resolve(base64String);
            };
            reader.onerror = error => reject(error);
        });
    }
</script>

</body>
</html>
