<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>UNLIMITED DRIVE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:#f8f9fa;color:#202124;padding:20px}
.drive-container{max-width:1050px;margin:0 auto;background:#fff;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.08);padding:24px}
.header{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #f1f3f4;padding-bottom:16px;margin-bottom:20px}
.logo{font-size:22px;font-weight:800;color:#1a73e8}.badge{background:#e8f0fe;color:#1a73e8;font-size:12px;padding:5px 10px;border-radius:12px;font-weight:700}
.upload-zone{border:2px dashed #1a73e8;background:#f8faff;border-radius:12px;padding:30px;text-align:center;cursor:pointer;transition:.2s;margin-bottom:18px}
.upload-zone.drag{background:#e8f0fe}.upload-icon{font-size:40px;margin-bottom:8px}.upload-text{font-size:16px;font-weight:600}.upload-sub{font-size:13px;color:#70757a;margin-top:5px}
.status{display:none;margin-bottom:18px;padding:12px;border-radius:8px;font-size:14px;font-weight:600;text-align:center;background:#e8f0fe;color:#1a73e8}.status.show{display:block}.status.error{background:#fce8e6;color:#c5221f}
.controls{display:flex;gap:10px;margin-bottom:18px}.search{flex:1;padding:11px 15px;border:1px solid #dadce0;border-radius:8px;outline:none;font-size:14px}.search:focus{border-color:#1a73e8}
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.file-card{border:1px solid #dadce0;border-radius:10px;padding:14px;background:#fff;display:flex;flex-direction:column;gap:10px;min-width:0}.file-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.1);border-color:#1a73e8}
.file-preview{width:100%;height:150px;border-radius:7px;background:#f1f3f4;display:flex;align-items:center;justify-content:center;overflow:hidden}.file-preview img,.file-preview video{width:100%;height:100%;object-fit:cover}.file-preview iframe{width:100%;height:100%;border:0}.file-icon{font-size:48px}
.file-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file-date{font-size:11px;color:#70757a}
.file-actions{display:flex;gap:8px}.btn{flex:1;border:none;padding:9px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none}.download{background:#1a73e8;color:#fff}.copy{background:#f1f3f4;color:#3c4043}.delete{background:#fce8e6;color:#c5221f}
.progress-wrap{display:none;margin-bottom:18px}.progress-item{background:#fff;border:1px solid #dadce0;border-radius:10px;padding:12px;margin-bottom:8px}.progress-top{display:flex;justify-content:space-between;gap:10px;font-size:13px}.progress-bar{height:7px;background:#eceff1;border-radius:99px;overflow:hidden;margin-top:8px}.progress-bar div{width:0;height:100%;background:#34a853;transition:width .12s}.progress-state{font-size:12px;color:#70757a;margin-top:6px}
.empty{text-align:center;color:#70757a;padding:60px 10px}
@media(max-width:650px){body{padding:8px}.drive-container{padding:14px}.header{align-items:flex-start;gap:8px;flex-direction:column}}
</style>
</head>
<body>
<div class="drive-container">
  <div class="header">
    <div class="logo">📂 UNLIMITED DRIVE</div>
    <div class="badge">☁️ Lưu chung cho mọi người</div>
  </div>

  <div class="upload-zone" id="uploadZone">
    <div class="upload-icon">☁️</div>
    <div class="upload-text">Nhấp để chọn file hoặc Kéo & Thả</div>
    <div class="upload-sub">Ảnh • Video • Nhạc • PDF • ZIP • File khác</div>
    <input id="fileInput" type="file" multiple hidden>
  </div>

  <div id="status" class="status"></div>
  <div id="progressWrap" class="progress-wrap"></div>

  <div class="controls">
    <input id="search" class="search" placeholder="🔍 Tìm kiếm file trong kho...">
  </div>

  <div id="fileGrid" class="file-grid"></div>
  <div id="empty" class="empty">Đang tải danh sách file...</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {
  getStorage, ref as storageRef, uploadBytesResumable, getDownloadURL, deleteObject
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-storage.js";
import {
  getDatabase, ref as dbRef, push, set, onValue, remove
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

const firebaseConfig = {
  apiKey:"AIzaSyCDQsJ_NrGK5ouRLS7vFr55OBZQ0nKhHSk",
  authDomain:"vietnam-life-game.firebaseapp.com",
  databaseURL:"https://vietnam-life-game-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"vietnam-life-game",
  storageBucket:"vietnam-life-game.firebasestorage.app",
  messagingSenderId:"134954120781",
  appId:"1:134954120781:web:d7f762adb80bfce3140e04",
  measurementId:"G-39VPPE1F9T"
};

const app=initializeApp(firebaseConfig);
const storage=getStorage(app);
const db=getDatabase(app);
const filesRef=dbRef(db,"files");

const uploadZone=document.getElementById("uploadZone");
const fileInput=document.getElementById("fileInput");
const grid=document.getElementById("fileGrid");
const empty=document.getElementById("empty");
const search=document.getElementById("search");
const status=document.getElementById("status");
const progressWrap=document.getElementById("progressWrap");

let allFiles=[];

function bytes(n){
  if(!n) return "0 B";
  const u=["B","KB","MB","GB","TB"];
  const i=Math.min(u.length-1,Math.floor(Math.log(n)/Math.log(1024)));
  return (n/Math.pow(1024,i)).toFixed(i?2:0)+" "+u[i];
}
function date(t){return new Date(t).toLocaleString("vi-VN")}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function icon(type){
  if((type||"").startsWith("image/")) return "🖼️";
  if((type||"").startsWith("video/")) return "🎬";
  if((type||"").startsWith("audio/")) return "🎵";
  if((type||"").includes("pdf")) return "📕";
  if(/zip|rar|7z/.test(type||"")) return "📦";
  return "📄";
}

function notify(msg,error=false){
  status.textContent=msg;
  status.className="status show"+(error?" error":"");
  if(!error) setTimeout(()=>status.className="status",3500);
}

function createPreview(file){
  const p=document.createElement("div");
  p.className="file-preview";
  const type=file.contentType||"";
  if(type.startsWith("image/")){
    const x=document.createElement("img"); x.src=file.url; x.loading="lazy"; p.appendChild(x);
  }else if(type.startsWith("video/")){
    const x=document.createElement("video"); x.src=file.url; x.controls=true; x.preload="metadata"; p.appendChild(x);
  }else if(type==="application/pdf"){
    const x=document.createElement("iframe"); x.src=file.url; p.appendChild(x);
  }else{
    const x=document.createElement("div"); x.className="file-icon"; x.textContent=icon(type); p.appendChild(x);
  }
  return p;
}

function render(){
  const key=search.value.trim().toLowerCase();
  const list=allFiles.filter(f=>(f.name||"").toLowerCase().includes(key))
    .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  grid.innerHTML="";
  empty.style.display=list.length?"none":"block";
  if(!list.length) empty.textContent=key?"Không tìm thấy file nào.":"Kho đang trống.";
  list.forEach(f=>{
    const card=document.createElement("div");
    card.className="file-card";
    card.appendChild(createPreview(f));

    const name=document.createElement("div");
    name.className="file-name";
    name.title=f.name;
    name.textContent=f.name;

    const meta=document.createElement("div");
    meta.className="file-date";
    meta.textContent=`${bytes(f.size)} • ${date(f.createdAt)}`;

    const actions=document.createElement("div");
    actions.className="file-actions";

    const dl=document.createElement("a");
    dl.className="btn download"; dl.textContent="Tải về";
    dl.href=f.url; dl.target="_blank"; dl.download=f.name;

    const cp=document.createElement("button");
    cp.className="btn copy"; cp.textContent="Copy Link";
    cp.onclick=async()=>{
      try{await navigator.clipboard.writeText(f.url);cp.textContent="✓ Đã copy";setTimeout(()=>cp.textContent="Copy Link",1000)}
      catch{prompt("Copy link:",f.url)}
    };

    const del=document.createElement("button");
    del.className="btn delete"; del.textContent="Xóa";
    del.onclick=()=>deleteFile(f);

    actions.append(dl,cp,del);
    card.append(name,meta,actions);
    grid.appendChild(card);
  });
}

function progressItem(file){
  const row=document.createElement("div");
  row.className="progress-item";
  row.innerHTML=`<div class="progress-top"><b>${esc(file.name)}</b><span>0%</span></div>
  <div class="progress-bar"><div></div></div><div class="progress-state">Đang chuẩn bị...</div>`;
  progressWrap.style.display="block";
  progressWrap.prepend(row);
  return {
    row, percent:row.querySelector(".progress-top span"),
    bar:row.querySelector(".progress-bar div"),
    state:row.querySelector(".progress-state")
  };
}

async function uploadFile(file){
  const ui=progressItem(file);
  notify(`☁️ Đang lưu "${file.name}" lên kho chung...`);

  const clean=file.name.replace(/[^\w.\-() ]/g,"_").slice(0,180);
  const path=`uploads/${new Date().toISOString().slice(0,10)}/${crypto.randomUUID()}_${clean}`;
  const ref=storageRef(storage,path);

  const task=uploadBytesResumable(ref,file,{
    contentType:file.type||"application/octet-stream",
    cacheControl:"public,max-age=31536000,immutable"
  });

  task.on("state_changed",
    snap=>{
      const p=snap.totalBytes?Math.round(snap.bytesTransferred/snap.totalBytes*100):0;
      ui.percent.textContent=p+"%";
      ui.bar.style.width=p+"%";
      ui.state.textContent=p<100?"Đang tải lên...":"Đang lưu thông tin...";
    },
    err=>{
      console.error(err);
      ui.state.textContent="❌ "+(err.code||err.message);
      ui.bar.style.background="#d93025";
      notify(`Upload lỗi: ${err.code||err.message}`,true);
    },
    async()=>{
      try{
        const url=await getDownloadURL(task.snapshot.ref);

        // Đây là phần làm file "lưu vĩnh viễn" và mọi người cùng thấy.
        const record=push(filesRef);
        await set(record,{
          name:file.name,
          size:file.size,
          contentType:file.type||"application/octet-stream",
          url:url,
          storagePath:path,
          createdAt:Date.now()
        });

        ui.percent.textContent="100%";
        ui.bar.style.width="100%";
        ui.state.textContent="✅ Đã lưu vào kho chung";
        notify(`✅ "${file.name}" đã được lưu. Người khác mở trang cũng thấy file này.`);

        setTimeout(()=>ui.row.remove(),1800);
        if(!progressWrap.children.length) progressWrap.style.display="none";
      }catch(err){
        console.error(err);
        ui.state.textContent="❌ Lưu danh sách thất bại";
        ui.bar.style.background="#d93025";
        notify(`File đã lên Storage nhưng không lưu được danh sách: ${err.code||err.message}`,true);
      }
    }
  );
}

async function deleteFile(file){
  if(!confirm(`Xóa "${file.name}" khỏi kho chung?`)) return;
  try{
    if(file.storagePath) await deleteObject(storageRef(storage,file.storagePath));
    await remove(dbRef(db,"files/"+file.id));
    notify("🗑️ Đã xóa khỏi kho chung.");
  }catch(err){
    console.error(err);
    notify(`Không thể xóa: ${err.code||err.message}`,true);
  }
}

uploadZone.onclick=()=>fileInput.click();
fileInput.onchange=e=>{[...e.target.files].forEach(uploadFile);fileInput.value=""};
["dragenter","dragover"].forEach(ev=>uploadZone.addEventListener(ev,e=>{e.preventDefault();uploadZone.classList.add("drag")}));
["dragleave","drop"].forEach(ev=>uploadZone.addEventListener(ev,e=>{e.preventDefault();uploadZone.classList.remove("drag")}));
uploadZone.addEventListener("drop",e=>[...e.dataTransfer.files].forEach(uploadFile));
search.oninput=render;

// Quan trọng: đọc dữ liệu từ Firebase chứ không đọc dữ liệu local của riêng trình duyệt.
onValue(filesRef,snap=>{
  const data=snap.val()||{};
  allFiles=Object.entries(data).map(([id,v])=>({id,...v}));
  render();
  empty.textContent=allFiles.length?"":"Kho đang trống.";
},err=>{
  console.error(err);
  notify(`Không đọc được kho chung: ${err.code||err.message}`,true);
  empty.textContent="Không thể đọc kho. Kiểm tra Firebase Rules.";
});

render();
</script>
</body>
</html>
