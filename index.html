<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Room Drive</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#202124}
header{height:64px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 20px;font-size:21px;font-weight:800;color:#1a73e8}
main{max-width:1050px;margin:24px auto;padding:0 14px}.panel{background:#fff;border:1px solid #e1e5ea;border-radius:14px;padding:18px;margin-bottom:15px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
input,button{font:inherit}input{border:1px solid #d3d8df;border-radius:9px;padding:12px;outline:0;min-width:250px}button{border:0;border-radius:9px;padding:12px 17px;cursor:pointer;font-weight:700}.blue{background:#1a73e8;color:#fff}.gray{background:#eef1f5}
.badge{font-weight:800;letter-spacing:2px;background:#f1f3f4;padding:10px 13px;border-radius:9px}.small{font-size:12px;color:#6b7280;line-height:1.5}.status{font-size:13px;color:#5f6368;margin-top:9px}
.drop{border:2px dashed #b8cdf3;background:#f8fbff;padding:36px;text-align:center;border-radius:14px;cursor:pointer}.drop.drag{background:#e8f0fe;border-color:#1a73e8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.card{background:#fff;border:1px solid #e1e5ea;border-radius:12px;padding:11px}.preview{height:145px;background:#eef1f4;border-radius:9px;display:flex;align-items:center;justify-content:center;overflow:hidden}.preview img,.preview video{width:100%;height:100%;object-fit:cover}.preview iframe{width:100%;height:100%;border:0}.ico{font-size:50px}
.name{font-weight:700;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:#6b7280;margin-top:5px}.actions{display:flex;gap:6px;margin-top:10px}.actions>*{flex:1;text-align:center;text-decoration:none}.empty{text-align:center;color:#777;padding:55px}.hidden{display:none!important}
</style></head><body>
<header>☁ Room Drive</header>
<main>
<div class="panel"><div class="row"><input id="room" maxlength="32" placeholder="Nhập mã phòng, VD: ABC123"><button id="enter" class="blue">Vào phòng</button><span id="badge" class="badge hidden"></span></div><div class="small" style="margin-top:9px">Chỉ nhập mã phòng. Kho phía sau được cấu hình sẵn.</div></div>
<div id="roomUI" class="hidden">
<div class="panel"><div id="drop" class="drop"><b>📤 Chọn hoặc kéo thả file</b><br><span class="small">File sẽ được lưu lâu dài vào phòng và người khác cùng mã phòng sẽ thấy.</span><input id="picker" type="file" multiple hidden></div><div id="status" class="status"></div></div>
<div id="grid" class="grid"></div><div id="empty" class="empty">Đang tải file...</div></div>
</main>
<script>
// Chỉ người quản trị sửa dòng này. Người dùng cuối chỉ nhập mã phòng.
const API_BASE="YOUR_BACKEND_URL";
let room="",files=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const fmt=n=>{if(!n)return'0 B';const u=['B','KB','MB','GB','TB'];let i=Math.min(4,Math.floor(Math.log(n)/Math.log(1024)));return(n/1024**i).toFixed(i?1:0)+' '+u[i]};
async function api(path,opt={}){const r=await fetch(API_BASE+path,opt);if(!r.ok)throw new Error((await r.text().catch(()=>''))||('HTTP '+r.status));return r.json()}
async function enterRoom(){room=$('room').value.trim().toUpperCase();if(!/^[A-Z0-9_-]{3,32}$/.test(room)){alert('Mã phòng 3-32 ký tự: A-Z, 0-9, _ hoặc -');return}$('roomUI').classList.remove('hidden');$('badge').textContent='ROOM '+room;$('badge').classList.remove('hidden');await load()}
async function load(){ $('empty').textContent='☁ Đang tải...';try{files=await api('/rooms/'+encodeURIComponent(room)+'/files');render()}catch(e){$('empty').innerHTML='❌ '+esc(e.message)+'<br><br><span class="small">Kiểm tra backend URL.</span>'}}
function render(){
$('grid').innerHTML='';$('empty').classList.toggle('hidden',files.length>0);if(!files.length){$('empty').textContent='Phòng chưa có file.';return}
files.forEach(f=>{const c=document.createElement('div');c.className='card';const p=document.createElement('div');p.className='preview';const t=f.contentType||'';
if(t.startsWith('image/'))p.innerHTML=`<img src="${f.url}" loading="lazy">`;else if(t.startsWith('video/'))p.innerHTML=`<video src="${f.url}" controls preload="metadata"></video>`;else if(t==='application/pdf')p.innerHTML=`<iframe src="${f.url}"></iframe>`;else p.innerHTML=`<div class="ico">${t.startsWith('audio/')?'🎵':'📄'}</div>`;
const n=document.createElement('div');n.className='name';n.textContent=f.name;n.title=f.name;const m=document.createElement('div');m.className='meta';m.textContent=fmt(f.size);
const a=document.createElement('div');a.className='actions';const d=document.createElement('a');d.className='blue';d.style.padding='9px';d.style.borderRadius='8px';d.style.color='#fff';d.textContent='Tải';d.href=f.url;d.target='_blank';d.download=f.name;
const cp=document.createElement('button');cp.className='gray';cp.textContent='Copy';cp.onclick=async()=>{await navigator.clipboard.writeText(f.url);cp.textContent='✓';setTimeout(()=>cp.textContent='Copy',900)};a.append(d,cp);c.append(p,n,m,a);$('grid').appendChild(c)})}
async function upload(file){const fd=new FormData();fd.append('file',file);$('status').textContent='🚀 Đang lưu '+file.name+'...';try{await api('/rooms/'+encodeURIComponent(room)+'/files',{method:'POST',body:fd});$('status').textContent='✅ Đã lưu: '+file.name;await load()}catch(e){$('status').textContent='❌ Upload lỗi: '+e.message}}
$('enter').onclick=enterRoom;$('room').onkeydown=e=>{if(e.key==='Enter')enterRoom()};$('drop').onclick=()=>$('picker').click();$('picker').onchange=e=>{[...e.target.files].forEach(upload);e.target.value=''};$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('drag')};$('drop').ondragleave=()=>$('drop').classList.remove('drag');$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('drag');[...e.dataTransfer.files].forEach(upload)};
</script></body></html>
